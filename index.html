<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Conklin AI Assistant</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#1a4d8f;--accent-light:#e8eef8;--bg:#f5f4f1;--surface:#ffffff;--border:#e2e0d8;--text:#1a1917;--text2:#5c5a52;--text3:#9c9a8e}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);display:flex;flex-direction:column;font-size:14px;color:var(--text)}
.header{background:var(--accent);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.header-avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center}
.header-avatar svg{width:17px;height:17px;stroke:white;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.header-name{font-size:14px;font-weight:600;color:white}
.header-status{font-size:11px;color:rgba(255,255,255,0.75);display:flex;align-items:center;gap:5px;margin-top:2px}
.header-status::before{content:'';width:6px;height:6px;border-radius:50%;background:#4ade80;display:inline-block}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.messages::-webkit-scrollbar{width:3px}
.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.msg{display:flex;gap:8px;animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg.user{justify-content:flex-end}
.av{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:2px}
.bot .av{background:var(--accent);color:white}
.user .av{background:var(--bg);border:1px solid var(--border);color:var(--text3)}
.bubble{padding:9px 13px;border-radius:12px;font-size:13.5px;line-height:1.6;max-width:80%;word-break:break-word}
.bot .bubble{background:var(--surface);border:1px solid var(--border);border-top-left-radius:3px}
.user .bubble{background:var(--accent);color:white;border-top-right-radius:3px}
.escalate{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:9px 13px;font-size:12.5px;line-height:1.6;color:#78350f;max-width:85%}
.escalate strong{display:block;margin-bottom:3px;color:#92400e}
.escalate a{color:var(--accent);text-decoration:none;font-weight:500}
.suggested{display:flex;flex-wrap:wrap;gap:5px}
.sq{padding:5px 11px;border:1px solid var(--border);background:var(--surface);border-radius:16px;font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.sq:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.typing{display:flex;align-items:center;gap:3px}
.typing span{width:5px;height:5px;background:var(--text3);border-radius:50%;animation:bop 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.input-row{padding:10px 12px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:7px;flex-shrink:0}
#inp{flex:1;padding:9px 14px;border:1px solid var(--border);border-radius:20px;font-size:13.5px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;transition:border-color .15s}
#inp:focus{border-color:var(--accent);background:white}
#inp::placeholder{color:var(--text3)}
#send-btn{padding:9px 18px;background:var(--accent);color:white;border:none;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
#send-btn:hover{opacity:.88}
#send-btn:disabled{opacity:.4;cursor:not-allowed}
.powered{text-align:center;padding:5px;font-size:10px;color:var(--text3);border-top:1px solid var(--bg);flex-shrink:0}
</style>
</head>
<body>

<div class="header">
  <div class="header-avatar"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
  <div><div class="header-name">Conklin Assistant</div><div class="header-status">Online — AI powered</div></div>
</div>
<div class="messages" id="msgs"></div>
<div class="input-row">
  <input id="inp" placeholder="Ask a question…" autocomplete="off" onkeydown="if(event.key==='Enter')send()"/>
  <button id="send-btn" onclick="send()">Send</button>
</div>
<div class="powered">Powered by Claude AI</div>

<script>
const CLAUDE_API_KEY = 'PASTE-YOUR-KEY-HERE';
const SUPPORT_EMAIL  = 'ecomm@conklinmetal.com';
const COMPANY        = 'Conklin';

const QA = [
  { q: "What is the primary objective of the E-Commerce site?", a: "To allow existing and new customers to place orders online. New customers can view the Global Catalog and request quotes. The site also serves as a customer portal where existing customers can log in to check open orders, check current balance, and print & pay invoices." },
  { q: "Why does the site require cookies?", a: "The site relies on cookies to store small pieces of data on your device to remember information about your visit. Cookies are required for the site to function properly — keeping you logged in, remembering items in your cart, saving preferences, and enabling secure transactions. When you first visit the site, click 'Accept Cookies' to ensure the site functions normally." },
  { q: "What criteria is required for a product to appear on the site?", a: "Two conditions must both be met:\n1. The product must be STOCKABLE and SELLABLE in P21 at the selected branch.\n2. The item code must be loaded in the PIM (Product Information Management) and assigned to a taxonomy category." },
  { q: "What products are displayed on the site?", a: "Not all P21 products are in the PIM — products were selected based on current inventory, Phocas sales data (items purchased 5x or more in the last 12 months), and a comparison of the current site's products.\n\nGuest (unauthenticated) users see a GLOBAL CATALOG of all items in the PIM across all Conklin warehouses.\n\nLogged-in (authenticated) users see their respective branch catalog but can change locations to view other warehouses.\n\nProducts can be added or removed upon request. Sort order is customizable." },
  { q: "What is the Taxonomy and why does it matter?", a: "Each product is assigned a category within Conklin's custom taxonomy. This aids user navigation and search, and improves SEO (Search Engine Optimization)." },
  { q: "What data is stored in P21 vs. the PIM?", a: "P21 stores: Inventory, Pricing, Item Class, Weights, GL data, etc.\nPIM stores: Product Images, Taxonomy Categories, Attributes (L x W x H, thickness, gauge, diameter, etc.)" },
  { q: "How are product titles determined?", a: "Product titles are based on Conklin's P21 Extended Descriptions. This data does not sync automatically and must be revised manually as Item Maintenance updates P21. If a product title needs to be changed, notify: Item Maintenance team, Jennifer Ho (PIM Manager), and Justin Evans." },
  { q: "How are brands assigned to products?", a: "Brands are determined by P21 data. Only one brand can be assigned per item code in the PIM. Generic products (such as Sheet Metal, Spiral Pipe, Fittings) will intentionally not display a brand." },
  { q: "Where did the product data come from? What do the badges mean?", a: "Product pages may show a badge on the lower right of the image indicating the data source:\n• AD = Affiliated Distributors content subscription\n• Unilog = Unilog content subscription\n• No badge = Conklin data enriched in-house with help from sales and purchasing teams" },
  { q: "What pricing do guest users see?", a: "Unauthenticated (guest) users see P21 Price Sheet 10 (P10 / List Price that mirrors P1) by default." },
  { q: "How do customers see their special pricing?", a: "Customers must be logged in to view their contract or P21 Price Sheet pricing." },
  { q: "What products require a quote and cannot be ordered online?", a: "Sheet Metal: Prices are NOT displayed — requires a quote. Customers cannot checkout online.\nMachinery: Prices ARE displayed but still requires a quote. Customers cannot checkout online." },
  { q: "Who can place an order online?", a: "A P21 account and website login are both required to checkout and place orders, and to view special pricing. Guest users will be prompted to sign up for an account when they attempt to checkout." },
  { q: "How is inventory displayed on the site?", a: "Inventory is displayed as 'In Stock' or 'Out of Stock' — the actual count is hidden from customer view." },
  { q: "How does inventory allocation work when an order is placed online?", a: "Inventory is immediately allocated in P21 once an order is submitted online. If online orders cause strain on branch inventory levels, we have the option to adjust the threshold so items display as 'Out of Stock' once inventory reaches a pre-designated percentage." },
  { q: "How do consignment warehouses work with E-Commerce?", a: "Consignment warehouses are NOT supported on the E-Commerce platform. Customers with inventory on consignment must place orders for that material through the branch directly." },
  { q: "Can customers pay invoices online?", a: "Not yet. This will be handled via a separate portal that will be linked on the site once available. Details TBA from Accounting." },
  { q: "Where do all emails go during testing?", a: "All emails during testing go to ecomm@conklinmetal.com — this includes new account registrations, RFQs, and order confirmations. If you sign up using a Conklin or personal email address you will NOT receive automated emails since they only go to the ecomm@conklinmetal.com inbox." },
  { q: "What database does the sandbox testing site use?", a: "The sandbox testing site uses a P21 test database with data similar to but separate from the live P21 data. This database is also used for other testing (e.g. Cycle Count app)." },
  { q: "What is a Web Reference Number?", a: "A Web Reference Number is generated for each online order in addition to the P21 SO#. See the Source Type/ID field in P21." },
  { q: "What are the current known issues?", a: "• RFQ email confirmation is missing data (including products, quantities, descriptions)\n• Refine results search doesn't allow for partial match\n• Facebook embed on homepage doesn't always appear — being replaced with an Instagram embed that requires customization" }
];

let hist = [], busy = false;

function buildPrompt() {
  let p = `You are a friendly, professional customer service assistant for ${COMPANY}. Answer questions ONLY using the knowledge base below. If the question is not covered, reply with exactly: ESCALATE: [brief reason]. Be concise and clear.\n\nKNOWLEDGE BASE:\n`;
  QA.forEach((qa, i) => p += `\nQ${i+1}: ${qa.q}\nA${i+1}: ${qa.a}\n`);
  return p;
}

function greet() {
  bot(`👋 Hi! I'm the ${COMPANY} AI Assistant. Ask me anything about our E-Commerce site — products, pricing, orders, accounts, and more.`);
  const d = document.createElement('div');
  d.className = 'suggested';
  d.innerHTML = QA.slice(0, 4).map(qa => {
    const lbl = qa.q.length > 42 ? qa.q.slice(0, 42) + '…' : qa.q;
    return `<button class="sq" onclick="quick('${qa.q.replace(/'/g, "\\'")}')">${lbl}</button>`;
  }).join('');
  document.getElementById('msgs').appendChild(d);
  scroll();
}

function quick(q) { document.getElementById('inp').value = q; send(); }

async function send() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text || busy) return;
  inp.value = '';
  document.querySelectorAll('.suggested').forEach(e => e.remove());
  user(text);
  hist.push({ role: 'user', content: text });
  busy = true;
  document.getElementById('send-btn').disabled = true;
  const tid = 't' + Date.now();
  typing(tid);
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': CLAUDE_API_KEY,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 800,
        system: buildPrompt(),
        messages: hist
      })
    });
    const data = await r.json();
    del(tid);
    if (data.error) { bot('⚠️ API error: ' + data.error.message); return; }
    const reply = data.content?.map(c => c.text || '').join('') || 'No response received.';
    hist.push({ role: 'assistant', content: reply });
    if (reply.startsWith('ESCALATE:')) {
      bot("I don't have a specific answer for that in my knowledge base.");
      escalateMsg(reply.replace('ESCALATE:', '').trim());
    } else {
      bot(reply);
    }
  } catch(e) {
    del(tid);
    bot('⚠️ Connection error. Please contact ' + SUPPORT_EMAIL);
  }
  busy = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('inp').focus();
}

function user(t) { add('user', `<div class="bubble">${esc(t)}</div><div class="av">You</div>`); }
function bot(t)  { add('bot',  `<div class="av">AI</div><div class="bubble">${t.replace(/\n/g,'<br>')}</div>`); }
function escalateMsg(r) {
  const d = document.createElement('div');
  d.innerHTML = `<div class="escalate"><strong>🙋 Connecting you to a team member</strong>${r ? r+'<br><br>' : ''}Contact us: <a href="mailto:${SUPPORT_EMAIL}">${SUPPORT_EMAIL}</a></div>`;
  document.getElementById('msgs').appendChild(d); scroll();
}
function typing(id) { add('bot', `<div class="av">AI</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`, id); }
function add(cls, html, id='') { const d=document.createElement('div'); d.className='msg '+cls; if(id)d.id=id; d.innerHTML=html; document.getElementById('msgs').appendChild(d); scroll(); }
function del(id) { const e=document.getElementById(id); if(e)e.remove(); }
function scroll() { const m=document.getElementById('msgs'); m.scrollTop=m.scrollHeight; }
function esc(s)  { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

greet();
</script>
</body>
</html>
